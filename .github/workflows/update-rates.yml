name: Update Rates
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build rates.json
        run: node update-rates.mjs
      - name: Commit rates.json
        run: |
          git config user.name "Tomco73"
          git config user.email "mohaltoam@gmail.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update rates"
          git push
